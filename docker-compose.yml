  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "http://localhost:8004"
        INTERNAL_API_URL: "http://agent-core:8004"
    container_name: frontend
    ports:
      - "${FRONTEND_PORT}:3000"
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:8004"
      INTERNAL_API_URL: "http://agent-core:8004"
    depends_on:
      - agent-core
    networks:
      - matprop_net

  backend_config:
    build:
      context: ./services/backend_config
      dockerfile: Dockerfile
    container_name: backend_config
    ports:
      - "8005:8005"
    volumes:
      - config_data:/app/config_store
    restart: unless-stopped
    networks:
      - matprop_net
  evaluation-service:
    build:
      context: ./services/evaluation_service
      dockerfile: Dockerfile
    container_name: evaluation-service
    ports:
      - "${EVAL_SERVICE_PORT:-8010}:8010"
    environment:
      EVAL_SERVICE_PORT: 8010
    volumes:
      - ./services/evaluation_service/storage/runs:/app/storage/runs
    depends_on:
      - agent-core
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8010/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - matprop_net
networks:
  matprop_net:
    driver: bridge

volumes:
  ollama_data:
  config_data:
